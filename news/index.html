<script>
(function(){
  var el=document.getElementById("headlines");
  function esc(t){return String(t).replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}
  var feed="https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko";
  var url="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feed)+"&count=12";
  var ctrl=new AbortController(),to=setTimeout(function(){ctrl.abort()},8000);
  fetch(url,{signal:ctrl.signal}).then(function(r){return r.json()}).then(function(d){
    clearTimeout(to);
    if(!d||d.status!=="ok"||!d.items||!d.items.length)throw 0;
    var h="";for(var i=0;i<d.items.length&&i<12;i++){var it=d.items[i];
      h+='<li><a href="'+esc(it.link)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></li>';}
    el.innerHTML=h;
  }).catch(function(){clearTimeout(to);el.innerHTML='<li class="loading">헤드라인 로딩 실패 — 아래 언론사 바로가기를 이용하세요.</li>';});
})();
</script>
