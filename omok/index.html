<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 문서5 - Excel</title>
<meta name="description" content="엑셀 대시보드 위에서 즐기는 오목(5목). 판을 끌어 구석으로 옮기고, 컴퓨터와 대국. 보스키(Esc)로 즉시 업무화면. 무료.">
<link rel="canonical" href="https://seam0814.github.io/simsim/omok/">
<link rel="stylesheet" href="../style.css">
<style>
  .bgsheet{border-collapse:collapse;table-layout:fixed}
  .bgsheet th{background:#f3f3f3;color:#888;font-size:11px;border:1px solid #d4d4d4;height:22px;text-align:center;font-weight:600}
  .bgsheet th.rn{width:30px}
  .bgsheet td{border:1px solid #e3e3e3;height:23px;padding:2px 10px;font-size:12px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}
  .bgsheet td.l{text-align:left}.bgsheet td.n{text-align:right;font-variant-numeric:tabular-nums}
  .bgsheet td.hd{background:#eef3ee;font-weight:600;color:#4a4a4a;text-align:center}
  .bgsheet td.title{background:#dfeedf;color:#1b5e20;font-weight:700;text-align:left}
  .bgsheet tr.alt td{background:#fafbfa}
  .bgsheet td.pos{color:#1565c0}.bgsheet td.neg{color:#c62828}
  .bgsheet td.cf1{background:#2e7d32;color:#fff}.bgsheet td.cf2{background:#a5d6a7}
  .bgsheet td.cf3{background:#fff3cd}.bgsheet td.cf4{background:#f6c6c6}
  .bgsheet td.tot{background:#e9f0e9;font-weight:700;color:#1b5e20}
  .bgsheet td.sub{background:#fff;color:#999;font-size:11px;text-align:left}
  #bg{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
  .bgsheet.aux{height:fit-content}
  .memo{border:1px solid #d4d4d4;background:#fffdf3;padding:10px 14px;font-size:12px;color:#555;min-width:210px;line-height:1.9;height:fit-content}
  .memo .mt{font-weight:700;color:#1b5e20;margin-bottom:4px}
  /* 떠있는 오목 창 */
  #panel{position:fixed;z-index:60;background:#fff;border:1px solid #777;box-shadow:0 8px 30px rgba(0,0,0,.25);border-radius:4px;overflow:hidden}
  #phead{background:#217346;color:#fff;padding:6px 10px;font-size:12px;cursor:move;display:flex;justify-content:space-between;align-items:center;user-select:none}
  #phead .btns span{cursor:pointer;margin-left:8px;border:1px solid rgba(255,255,255,.55);border-radius:3px;padding:0 7px;font-weight:700;line-height:18px;display:inline-block}
  #phead .btns span:hover{background:rgba(255,255,255,.2)}
  #pbody.min{display:none}
  #pbody{padding:8px}
  #pbody.min{display:none}
  .otoolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:#555;margin-bottom:6px}
  .lv button{font:inherit;border:1px solid #d4d4d4;background:#f8f8f8;padding:3px 7px;border-radius:3px;cursor:pointer;color:#217346;font-size:11px}
  .lv button.on{background:#217346;color:#fff;border-color:#217346}
  .mini{border:1px solid #d4d4d4;background:#f8f8f8;padding:3px 7px;border-radius:3px;cursor:pointer;color:#555;font-size:11px}
  table.ob{border-collapse:collapse}
  table.ob th{background:#f3f3f3;color:#999;font-size:9px;border:1px solid #d4d4d4;width:22px;height:18px;text-align:center;font-weight:600}
  table.ob td{width:22px;height:22px;border:1px solid #dcdcdc;background:#fff;cursor:pointer;padding:0}
  table.ob td.s1{background:#2e7d32}
  table.ob td.s2{background:#c0504d}
  table.ob td.last{outline:2px solid #ffd400;outline-offset:-2px}
</style>
</head>
<body>
<div class="wrap">
  <div id="bg"></div>
</div>
<div id="panel">
  <div id="phead"><span id="ptitle">데이터 유효성 검사</span><span class="btns"><span id="pmin" title="접기/펴기">─</span></span></div>
  <div id="pbody">
    <div class="otoolbar">
      <span class="lv" id="lv"><button data-d="1">쉬움</button><button data-d="2" class="on">보통</button><button data-d="3">어려움</button></span>
      <span id="state">내 차례</span>
      <button class="mini" id="restart">새 대국</button>
      <select id="bgsel" class="mini" style="padding:2px 4px"><option value="office">배경:일반사무</option><option value="sales">배경:영업</option><option value="dev">배경:개발/IT</option><option value="finance">배경:회계</option></select>
    </div>
    <table class="ob" id="board"></table>
    <div style="font-size:10px;color:#999;margin-top:5px">제목줄을 끌어 이동 · Esc=업무화면</div>
  </div>
</div>
<script>window.SITE_ROOT="../";</script>
<script src="../common.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  /* 배경 데이터 시트 */
  /* 배경 데이터 시트 (업종별 템플릿) */
  function rr(a,b){return Math.floor(a+Math.random()*(b-a))}
  var FNAME=["김","이","박","최","정","강","조","윤","장","임","한","오"];
  function rname(){return FNAME[rr(0,FNAME.length)]+["대리","과장","사원","주임","차장","팀장"][rr(0,6)]}
  function cfr(v){return v>=105?"cf1":v>=100?"cf2":v>=95?"cf3":"cf4"}
  var TPL={
    office:{t:"2026년 상반기 부서별 실적 집계표 (단위: 백만원)",s:"조회기준 2026-06-30 · 작성: 경영기획팀 · 결재 완료",
      items:["영업1팀","영업2팀","생산1팀","생산2팀","품질팀","물류팀","구매팀","R&D센터","경영지원","마케팅팀","CS팀","해외영업","기획팀","재무팀","인사팀","총무팀"],
      cols:[{l:"부서",w:108,k:"item"},{l:"목표",w:66,k:"num",a:200,b:360},{l:"실적",w:66,k:"num",a:190,b:380},{l:"1분기",w:62,k:"num",a:90,b:190},{l:"2분기",w:62,k:"num",a:90,b:190},{l:"달성률",w:66,k:"pct",a:86,b:118,cf:1},{l:"전년비",w:60,k:"yoy"},{l:"비고",w:92,k:"pick",p:["양호","검토요망","초과달성","정상","주의","우수","승인"]}]},
    sales:{t:"거래처별 매출·수금 현황 (단위: 천원, VAT 별도)",s:"조회기준 2026-06-30 · 영업관리팀",
      items:["가온테크","나래상사","다온물산","라온전자","마루ENG","바다무역","사랑유통","아름산업","자연상회","하늘코퍼","두리상사","세움테크","온누리","미래상사","정음물산","해든무역"],
      cols:[{l:"거래처",w:120,k:"item"},{l:"담당",w:62,k:"name"},{l:"계약액",w:80,k:"num",a:300,b:900},{l:"수금액",w:80,k:"num",a:200,b:850},{l:"미수금",w:76,k:"num",a:0,b:150},{l:"수금률",w:64,k:"pct",a:70,b:100,cf:1},{l:"등급",w:48,k:"pick",p:["A","B","C","A","B"]},{l:"최근접촉",w:76,k:"date"}]},
    dev:{t:"이슈 트래커 — 2026 Sprint 14 보드",s:"업데이트 2026-06-30 10:24 · 프로젝트: WMS-2.0",count:16,
      cols:[{l:"이슈",w:72,k:"issue"},{l:"제목",w:176,k:"pick",p:["로그인 세션 만료 처리","리스트 페이지네이션 버그","CSV 내보내기 인코딩","결제 콜백 타임아웃","대시보드 차트 렌더링","권한 체크 누락","알림 중복 발송","캐시 무효화 이슈","모바일 레이아웃 깨짐","API 응답 지연 개선"]},{l:"담당",w:60,k:"name"},{l:"상태",w:64,k:"pick",p:["진행중","검토","완료","대기","QA"]},{l:"우선",w:54,k:"pick",p:["높음","보통","낮음","긴급"]},{l:"SP",w:42,k:"num",a:1,b:8},{l:"수정",w:70,k:"date"}]},
    finance:{t:"계정별 잔액 시산표 (2026년 6월)",s:"작성 2026-06-30 · 재무회계팀",
      items:["현금","보통예금","외상매출금","미수금","상품","비품","차량운반구","외상매입금","미지급금","예수금","단기차입금","자본금","매출","매출원가","급여","지급수수료"],
      cols:[{l:"코드",w:64,k:"code"},{l:"계정과목",w:120,k:"item"},{l:"차변",w:88,k:"num",a:100,b:900},{l:"대변",w:88,k:"num",a:100,b:900},{l:"잔액",w:92,k:"num",a:0,b:500},{l:"비고",w:90,k:"pick",p:["","확인","이월","조정","검토"]}]}
  };
  function cellVal(col,i,items){
    if(col.k==="item")return{t:items[i],c:"l"};
    if(col.k==="name")return{t:rname(),c:"l"};
    if(col.k==="num")return{t:rr(col.a,col.b).toLocaleString(),c:"n"};
    if(col.k==="pct"){var v=rr(col.a,col.b);return{t:v+"%",c:"n"+(col.cf?" "+cfr(v):"")};}
    if(col.k==="yoy"){var y=rr(-7,14);return{t:(y>=0?"+":"")+y+"%",c:"n "+(y>=0?"pos":"neg")};}
    if(col.k==="pick")return{t:col.p[rr(0,col.p.length)],c:"l"};
    if(col.k==="date")return{t:"06/"+("0"+rr(1,28)).slice(-2),c:"l"};
    if(col.k==="issue")return{t:"ISS-"+(1040+rr(1,900)),c:"l"};
    if(col.k==="code")return{t:String(rr(101,899)),c:"n"};
    return{t:"",c:""};
  }
  function auxBlocks(){var a="";
    a+="<table class='bgsheet aux'><colgroup><col style='width:30px'><col style='width:96px'><col style='width:86px'></colgroup>";
    a+="<tr><th class='rn'></th><th>A</th><th>B</th></tr><tr><th class='rn'>1</th><td class='title' colspan='2'>요약</td></tr><tr><th class='rn'>2</th><td class='hd'>구분</td><td class='hd'>값</td></tr>";
    var sm=[["총계",rr(8000,15000)],["평균",rr(400,900)],["최대",rr(900,1400)],["최소",rr(50,200)],["건수",rr(80,200)],["목표달성",rr(88,118)+"%"]];
    sm.forEach(function(x,i){a+="<tr"+(i%2?" class='alt'":"")+"><th class='rn'>"+(i+3)+"</th><td class='l'>"+x[0]+"</td><td class='n'>"+(typeof x[1]=="number"?x[1].toLocaleString():x[1])+"</td></tr>";});
    a+="</table>";
    a+="<table class='bgsheet aux'><colgroup><col style='width:30px'><col style='width:52px'><col style='width:74px'><col style='width:60px'></colgroup>";
    a+="<tr><th class='rn'></th><th>A</th><th>B</th><th>C</th></tr><tr><th class='rn'>1</th><td class='title' colspan='3'>월별 추이</td></tr><tr><th class='rn'>2</th><td class='hd'>월</td><td class='hd'>실적</td><td class='hd'>증감</td></tr>";
    for(var m=1;m<=6;m++){var y=rr(-8,15);a+="<tr"+(m%2?" class='alt'":"")+"><th class='rn'>"+(m+2)+"</th><td class='l'>"+m+"월</td><td class='n'>"+(rr(200,500)*10).toLocaleString()+"</td><td class='n "+(y>=0?"pos":"neg")+"'>"+(y>=0?"+":"")+y+"%</td></tr>";}
    a+="</table>";
    a+="<div class='memo'><div class='mt'>업무 메모</div>- 월말 마감 자료 취합 (D-2)<br>- 거래처 미수금 확인 요청<br>- 분기 보고서 초안 공유<br>- 비품 구매 품의 결재<br>- 정기 회의 14:00 B동 302호</div>";
    return a}
  function renderBg(key){var tp=TPL[key]||TPL.office,cols=tp.cols,n=cols.length,rows=tp.items?tp.items.length:tp.count;
    var cg="<colgroup><col style='width:30px'>"+cols.map(function(x){return "<col style='width:"+x.w+"px'>"}).join("")+"</colgroup>";
    var h="<tr><th class='rn'></th>";for(var c=0;c<n;c++)h+="<th>"+String.fromCharCode(65+c)+"</th>";h+="</tr>";
    h+="<tr><th class='rn'>1</th><td class='title' colspan='"+n+"'>"+tp.t+"</td></tr>";
    h+="<tr><th class='rn'>2</th><td class='sub' colspan='"+n+"'>"+tp.s+"</td></tr>";
    h+="<tr><th class='rn'>3</th>"+cols.map(function(x){return "<td class='hd'>"+x.l+"</td>"}).join("")+"</tr>";
    for(var i=0;i<rows;i++){var alt=i%2?" class='alt'":"",row="";for(var c=0;c<n;c++){var v=cellVal(cols[c],i,tp.items);row+="<td class='"+v.c+"'>"+v.t+"</td>";}h+="<tr"+alt+"><th class='rn'>"+(i+4)+"</th>"+row+"</tr>";}
    for(var e=0;e<3;e++){h+="<tr><th class='rn'>"+(rows+4+e)+"</th>";for(var c=0;c<n;c++)h+="<td></td>";h+="</tr>";}
    $("#bg").innerHTML="<table class='bgsheet'>"+cg+h+"</table>"+auxBlocks();}
  var curBg=store.get("bgtpl","office");renderBg(curBg);
  (function(){var sel=$("#bgsel");if(sel){sel.value=curBg;sel.addEventListener("change",function(){store.set("bgtpl",sel.value);renderBg(sel.value)})}})();

  /* 오목 */
  var N=15,g,over,last,level=2,thinking=false,DIRS=[[0,1],[1,0],[1,1],[1,-1]];
  function inb(r,c){return r>=0&&r<N&&c>=0&&c<N}
  function dirInfo(r,c,p,dr,dc){var len=1,i=1;while(inb(r+dr*i,c+dc*i)&&g[r+dr*i][c+dc*i]===p){len++;i++}
    var oF=inb(r+dr*i,c+dc*i)&&g[r+dr*i][c+dc*i]===0?1:0;var j=1;while(inb(r-dr*j,c-dc*j)&&g[r-dr*j][c-dc*j]===p){len++;j++}
    var oB=inb(r-dr*j,c-dc*j)&&g[r-dr*j][c-dc*j]===0?1:0;return{len:len,open:oF+oB}}
  function win(r,c,p){for(var d=0;d<4;d++)if(dirInfo(r,c,p,DIRS[d][0],DIRS[d][1]).len>=5)return true;return false}
  function pat(len,open){if(len>=5)return 100000;if(len===4)return open>=2?50000:open===1?6000:0;if(len===3)return open>=2?5000:open===1?600:0;if(len===2)return open>=2?500:open===1?60:0;return open>=2?8:2}
  function evalCell(r,c,p){g[r][c]=p;var s=0;for(var d=0;d<4;d++){var i=dirInfo(r,c,p,DIRS[d][0],DIRS[d][1]);s+=pat(i.len,i.open)}g[r][c]=0;return s}
  function hasN(r,c){for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++){if(!dr&&!dc)continue;var nr=r+dr,nc=c+dc;if(inb(nr,nc)&&g[nr][nc])return true}return false}
  function aiMove(){var W=level===1?0.5:level===2?0.95:1.05,jit=level===1?4000:level===2?400:40,any=false;
    for(var r=0;r<N&&!any;r++)for(var c=0;c<N;c++)if(g[r][c]){any=true;break}
    if(!any)return[7,7];var best=[7,7],bv=-1;
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){if(g[r][c]||!hasN(r,c))continue;var tot=evalCell(r,c,2)+evalCell(r,c,1)*W+Math.random()*jit;if(tot>bv){bv=tot;best=[r,c]}}
    return best}
  function genCands(){var a=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!g[r][c]&&hasN(r,c))a.push([r,c]);if(!a.length)a.push([7,7]);return a}
  function scored(){return genCands().map(function(p){return[p[0],p[1],evalCell(p[0],p[1],2)+evalCell(p[0],p[1],1)]}).sort(function(x,y){return y[2]-x[2]})}
  function evalBoard(p){var s=0;for(var r=0;r<N;r++)for(var c=0;c<N;c++){if(g[r][c]!==p)continue;for(var d=0;d<4;d++){var dr=DIRS[d][0],dc=DIRS[d][1];if(inb(r-dr,c-dc)&&g[r-dr][c-dc]===p)continue;var len=0,i=0;while(inb(r+dr*i,c+dc*i)&&g[r+dr*i][c+dc*i]===p){len++;i++}var o1=inb(r-dr,c-dc)&&g[r-dr][c-dc]===0?1:0,o2=inb(r+dr*len,c+dc*len)&&g[r+dr*len][c+dc*len]===0?1:0;s+=pat(len,o1+o2)}}return s}
  function aiHard(){var cs=genCands(),k;
    for(k=0;k<cs.length;k++)if(evalCell(cs[k][0],cs[k][1],2)>=100000)return cs[k];   // 내가 이기는 수
    for(k=0;k<cs.length;k++)if(evalCell(cs[k][0],cs[k][1],1)>=100000)return cs[k];   // 상대 이기는 수 차단
    var top=scored().slice(0,12),best=top[0]||[7,7],alpha=-1e18;
    for(k=0;k<top.length;k++){var cd=top[k];g[cd[0]][cd[1]]=2;
      var otop=scored().slice(0,10),minv=1e18,j;
      for(j=0;j<otop.length;j++){var od=otop[j];
        if(evalCell(od[0],od[1],1)>=100000){minv=-1e18;break;}  // 이 수 두면 상대가 이김 → 회피
        g[od[0]][od[1]]=1;var val=evalBoard(2)-evalBoard(1)*1.1;g[od[0]][od[1]]=0;
        if(val<minv)minv=val;}
      g[cd[0]][cd[1]]=0;
      if(minv>alpha){alpha=minv;best=cd;}}
    return [best[0],best[1]]}
  function render(){var h="<tr><th></th>";for(var c=0;c<N;c++)h+="<th>"+String.fromCharCode(65+c)+"</th>";h+="</tr>";
    for(var r=0;r<N;r++){h+="<tr><th>"+(r+1)+"</th>";for(var c=0;c<N;c++){var v=g[r][c],cls=v===1?"s1":v===2?"s2":"";
      if(last&&last[0]===r&&last[1]===c)cls+=" last";
      h+="<td class='"+cls+"' data-r='"+r+"' data-c='"+c+"'></td>"}h+="</tr>"}$("#board").innerHTML=h}
  function setState(t){$("#state").textContent=t}
  function full(){for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!g[r][c])return false;return true}
  function playerMove(r,c){if(over||thinking||g[r][c])return;g[r][c]=1;last=[r,c];
    if(win(r,c,1)){over=true;render();setState("결재 승인 — 승리!");return}if(full()){over=true;render();setState("보류 — 무승부");return}
    render();setState("상대 발언 중…");thinking=true;
    setTimeout(function(){var m=(level===3?aiHard():aiMove());g[m[0]][m[1]]=2;last=m;thinking=false;
      if(win(m[0],m[1],2)){over=true;render();setState("반려 — 패배");return}if(full()){over=true;render();setState("보류");return}
      render();setState("내 차례")},160)}
  function init(){g=[];for(var r=0;r<N;r++){g[r]=[];for(var c=0;c<N;c++)g[r][c]=0}over=false;last=null;thinking=false;setState("내 차례");render()}
  $("#board").addEventListener("click",function(e){var td=e.target.closest("td");if(td&&td.dataset.r!==undefined)playerMove(+td.dataset.r,+td.dataset.c)});
  $("#lv").addEventListener("click",function(e){var b=e.target;if(b.tagName!=="BUTTON")return;[].forEach.call(this.children,function(x){x.classList.remove("on")});b.classList.add("on");level=+b.dataset.d;init()});
  $("#restart").addEventListener("click",init);

  /* 드래그 이동 + 최소화 */
  var panel=$("#panel"),phead=$("#phead"),dragging=false,ox=0,oy=0;
  function setPos(x,y){x=Math.max(0,Math.min(window.innerWidth-80,x));y=Math.max(0,Math.min(window.innerHeight-40,y));panel.style.left=x+"px";panel.style.top=y+"px";panel.style.right="auto";store.set("omokpos",x+","+y)}
  var saved=store.get("omokpos","");if(saved){var p=saved.split(",");setPos(+p[0],+p[1])}else{panel.style.left=Math.max(10,(window.innerWidth-360)/2)+"px";panel.style.top="90px"}
  phead.addEventListener("mousedown",function(e){dragging=true;ox=e.clientX-panel.offsetLeft;oy=e.clientY-panel.offsetTop;e.preventDefault()});
  window.addEventListener("mousemove",function(e){if(dragging)setPos(e.clientX-ox,e.clientY-oy)});
  window.addEventListener("mouseup",function(){dragging=false});
  phead.addEventListener("touchstart",function(e){var t=e.touches[0];dragging=true;ox=t.clientX-panel.offsetLeft;oy=t.clientY-panel.offsetTop},{passive:true});
  window.addEventListener("touchmove",function(e){if(dragging){var t=e.touches[0];setPos(t.clientX-ox,t.clientY-oy);e.preventDefault()}},{passive:false});
  window.addEventListener("touchend",function(){dragging=false});
  $("#pmin").addEventListener("click",function(e){e.stopPropagation();$("#pbody").classList.toggle("min");this.textContent=$("#pbody").classList.contains("min")?"□":"─"});
  init();
})();
</script>
</body>
</html>
