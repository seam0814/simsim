<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 문서 - Excel</title>
<meta name="description" content="한 화면에서 실시간 뉴스·미니게임·익명 채팅을 동시에. 스프레드시트처럼 보이는 올인원. Esc로 업무화면 전환.">
<link rel="canonical" href="https://seam0814.github.io/simsim/desk/">
<link rel="stylesheet" href="../style.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font)}
  .sheet{height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
  /* 열 머리글 */
  .colhdr{display:flex;flex:0 0 22px;background:var(--head);border-bottom:1px solid var(--line);overflow:hidden}
  .colhdr .corner{flex:0 0 34px;border-right:1px solid var(--line)}
  .colhdr .c{flex:0 0 64px;text-align:center;line-height:22px;font-size:11px;color:#8a8a8a;border-right:1px solid var(--line)}
  .srow{flex:1;display:flex;min-height:0;overflow:hidden}
  /* 행 번호 */
  .rowhdr{flex:0 0 34px;background:var(--head);border-right:1px solid var(--line);overflow:hidden}
  .rowhdr .r{height:22px;line-height:22px;text-align:center;font-size:11px;color:#8a8a8a;border-bottom:1px solid var(--line)}
  /* 셀 격자 바탕 */
  .content{flex:1;display:flex;gap:1px;min-height:0;
    background-color:var(--line);
    background-image:linear-gradient(#fff,#fff);
  }
  .gridbg{position:absolute;inset:0;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 22px;opacity:.5;pointer-events:none}
  /* 패널 = 셀 범위 (각지게, 회색 머리글 셀) */
  .panel{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
  .ph{background:var(--head);color:#1b5e20;border-bottom:1px solid var(--line);font-weight:700;font-size:12px;padding:5px 9px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex:0 0 auto}
  .ph .ctl{font-weight:400}
  .pb{flex:1;min-height:0;overflow:auto;background:#fff}
  .left{flex:0 0 300px}.center{flex:1;min-width:0}.right{flex:0 0 322px}
  .center .pb{overflow:hidden;display:flex;flex-direction:column}
  .center iframe{flex:1;width:100%;border:0;background:#fff}
  #gsel{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:#1b5e20;border-radius:0;padding:1px 4px;max-width:170px}
  #nref{cursor:pointer;background:#fff;border:1px solid var(--line);color:#1b5e20;font-size:11px;padding:1px 7px;border-radius:0}
  /* 뉴스: 셀 행처럼 */
  .sokbar{background:#fff8e6;border-bottom:1px solid #ecd9a0;padding:6px 9px;font-size:12px;color:#8a6d00;line-height:1.4}
  .sokbar b{color:#c0504d}
  .nitem{display:flex;gap:0;text-decoration:none;color:#1c2b1c;font-size:13px;line-height:1.4;border-bottom:1px solid var(--line)}
  .nitem .ni{flex:0 0 26px;background:var(--head);color:#9a9a9a;border-right:1px solid var(--line);text-align:center;font-size:10px;padding-top:7px}
  .nitem .nt{padding:7px 9px;min-width:0}
  .nitem:hover .nt{background:#eafaf0}
  .nitem .nm{font-size:11px;color:#8a8f98;margin-top:2px}
  .nloading{padding:14px 10px;color:#999;font-size:12px}
  /* 채팅 셀 */
  .right .pb{display:flex;flex-direction:column;padding:0}
  .right #lounge{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 9px 9px}
  .right #lounge .cat{margin:9px 0 6px;border-left:3px solid var(--sel)}
  .right #lounge .chatbox{max-height:none;flex:1;min-height:0;border-radius:0}
  .right #lounge .chatform input,.right #lounge .chatform .btn{border-radius:0}
  /* 하단 시트 탭 */
  .tabs{flex:0 0 26px;display:flex;align-items:stretch;background:var(--head);border-top:1px solid var(--line);font-size:12px;overflow:hidden}
  .tabs .nav{color:#999;padding:0 8px;display:flex;align-items:center;border-right:1px solid var(--line)}
  .tabs .t{padding:0 14px;display:flex;align-items:center;border-right:1px solid var(--line);color:#555;cursor:default}
  .tabs .t.on{background:#fff;color:#1b5e20;font-weight:700;border-top:2px solid var(--sel);margin-top:-1px}
  .tabs .plus{padding:0 10px;display:flex;align-items:center;color:#999}
  .tabs .status{margin-left:auto;padding:0 12px;display:flex;align-items:center;color:#999;font-size:11px}
  @media(max-width:860px){
    .sheet{height:auto}
    .srow{flex-direction:column}
    .rowhdr{display:none}
    .content{flex-direction:column}
    .left,.right,.center{flex:none}
    .center{height:470px}.left{max-height:320px}.right{min-height:360px}
    .right #lounge .chatbox{min-height:200px}
    .colhdr .c:nth-child(n+8){display:none}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="colhdr" id="colh"><div class="corner"></div></div>
  <div class="srow">
    <div class="rowhdr" id="rowh"></div>
    <div class="content">
      <div class="gridbg"></div>
      <div class="panel left">
        <div class="ph"><span>A : 실시간 뉴스</span><button id="nref" class="ctl">새로고침</button></div>
        <div class="sokbar" id="sok">속보 불러오는 중…</div>
        <div class="pb" id="news"><div class="nloading">불러오는 중…</div></div>
      </div>
      <div class="panel center">
        <div class="ph"><span>작업 영역</span><select id="gsel" class="ctl"></select></div>
        <div class="pb"><iframe id="gframe" title="game" referrerpolicy="no-referrer"></iframe></div>
      </div>
      <div class="panel right">
        <div class="ph"><span>검토 : 메모</span><span class="ctl" style="color:#888;font-size:11px">익명</span></div>
        <div class="pb"><div id="lounge"></div></div>
      </div>
    </div>
  </div>
  <div class="tabs">
    <span class="nav">◀ ▶</span>
    <span class="t on">대시보드</span>
    <span class="t">매출실적</span>
    <span class="t">분기요약</span>
    <span class="t">Sheet3</span>
    <span class="plus">＋</span>
    <span class="status">준비  ·  평균: 0  ·  합계: 0</span>
  </div>
</div>
<script>window.SITE_ROOT="../";</script>
<script src="../common.js"></script>
<script>
(function(){
  /* 열 머리글 A,B,C… / 행 번호 1,2,3… */
  function colName(n){var s="";n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
  var CH=document.getElementById("colh");for(var i=0;i<40;i++){var d=document.createElement("div");d.className="c";d.textContent=colName(i);CH.appendChild(d)}
  var RH=document.getElementById("rowh");for(var j=1;j<=80;j++){var r=document.createElement("div");r.className="r";r.textContent=j;RH.appendChild(r)}

  /* 게임 드롭다운: window.ITEMS 재활용 */
  var items=(window.ITEMS||[]).filter(function(t){return (t.path||"")!=="desk/" && (t.path||"")!=="news/"});
  var sel=document.getElementById("gsel"),fr=document.getElementById("gframe");
  items.forEach(function(t){var href=t.ext?t.url:("../"+t.path);var o=document.createElement("option");o.value=href;o.textContent=t.title;sel.appendChild(o)});
  function setg(){fr.src=sel.value;try{track("desk_game",{g:sel.options[sel.selectedIndex].text})}catch(e){}}
  sel.addEventListener("change",setg);if(items.length){sel.selectedIndex=0;setg();}

  /* 왼쪽 실시간 뉴스 */
  var newsEl=document.getElementById("news"),sokEl=document.getElementById("sok"),lastTop="";
  var FEED="https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko";
  function esc(t){return String(t||"").replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}
  function ago(d){var t=new Date(d).getTime();if(isNaN(t))return "";var m=Math.floor((Date.now()-t)/60000);if(m<1)return "방금";if(m<60)return m+"분 전";var h=Math.floor(m/60);if(h<24)return h+"시간 전";return Math.floor(h/24)+"일 전";}
  function timed(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(0)},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}
  function viaR(u){return timed(fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(u)+"&count=14").then(function(r){return r.json()}),9000).then(function(d){if(!d||d.status!=="ok"||!d.items||!d.items.length)throw 0;return d.items.map(function(x){return{title:x.title,link:x.link,pubDate:x.pubDate}})})}
  function viaA(u){return timed(fetch("https://api.allorigins.win/get?url="+encodeURIComponent(u)).then(function(r){return r.json()}),9000).then(function(d){var xml=new DOMParser().parseFromString(d.contents,"text/xml"),its=xml.querySelectorAll("item");if(!its.length)throw 0;var a=[];its.forEach(function(it){a.push({title:(it.querySelector("title")||{}).textContent,link:(it.querySelector("link")||{}).textContent,pubDate:(it.querySelector("pubDate")||{}).textContent})});return a})}
  function get(u){return viaR(u).catch(function(){return viaA(u)})}
  function splitSrc(t){var i=t.lastIndexOf(" - ");return i>15?[t.slice(0,i),t.slice(i+3)]:[t,""]}
  function load(){
    get(FEED).then(function(list){
      var top=splitSrc(list[0].title||""),isNew=lastTop&&list[0].link!==lastTop;
      sokEl.innerHTML='<b>'+(isNew?"[NEW] ":"")+'속보</b> '+esc(top[0]);lastTop=list[0].link;
      var h="";for(var i=0;i<list.length;i++){var s=splitSrc(list[i].title||"");
        h+='<a class="nitem" href="'+esc(list[i].link)+'" target="_blank" rel="noopener"><span class="ni">'+(i+1)+'</span><span class="nt">'+esc(s[0])+'<div class="nm">'+(s[1]?esc(s[1])+" · ":"")+ago(list[i].pubDate)+'</div></span></a>';}
      newsEl.innerHTML=h;
    }).catch(function(){newsEl.innerHTML='<div class="nloading">뉴스를 잠시 후 다시 불러와요.</div>';sokEl.textContent="속보 로딩 대기 중…";});
  }
  document.getElementById("nref").addEventListener("click",load);
  load();setInterval(load,180000);
})();
</script>
</body>
</html>
