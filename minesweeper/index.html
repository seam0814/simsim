<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 문서4 - Excel</title>
<meta name="description" content="고전 지뢰찾기를 스프레드시트처럼. 왼쪽 클릭으로 열고 우클릭(모바일 길게 눌러)으로 깃발. 초급·중급 난이도. 무료, 설치 없이.">
<link rel="canonical" href="https://seam0814.github.io/simsim/minesweeper/">
<link rel="stylesheet" href="../style.css">
<style>
  .msbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:13px;color:#444}
  .msbar b{color:#1b5e20}
  .diff button{font:inherit;border:1px solid var(--line,#d4d4d4);background:#f8f8f8;padding:5px 10px;border-radius:4px;cursor:pointer;margin-right:6px;color:#217346}
  .diff button.on{background:#217346;color:#fff;border-color:#217346}
  .msscroll{overflow:auto}
  table.ms{border-collapse:collapse;margin-top:8px}
  table.ms th{background:#f3f3f3;color:#999;font-weight:600;font-size:11px;min-width:24px;height:22px;border:1px solid #d4d4d4;text-align:center}
  table.ms td{width:26px;height:26px;min-width:26px;border:1px solid #c6c6c6;text-align:center;font-weight:700;font-size:14px;cursor:pointer;user-select:none;background:#e4e4e4}
  table.ms td:hover{background:#dceedd}
  table.ms td.rev{background:#fff;cursor:default}
  table.ms td.rev:hover{background:#fff}
  table.ms td.flag{background:#ffe0e0;color:#c62828}
  table.ms td.mine{background:#333;color:#fff}
  table.ms td.boom{background:#c62828;color:#fff}
  .n1{color:#1565c0}.n2{color:#2e7d32}.n3{color:#c62828}.n4{color:#6a1b9a}.n5{color:#8d6e63}.n6{color:#00838f}.n7{color:#333}.n8{color:#777}
</style>
</head>
<body>
<div class="wrap">
  <div id="site-header"></div>
  <h1>지뢰찾기</h1>
  <p class="sub">왼쪽 클릭=열기 · 우클릭(모바일은 길게 누르기)=깃발 · Esc=업무화면</p>
  <div class="card">
    <div class="diff" id="diff">
      <button data-w="9" data-h="9" data-m="10" class="on">초급 9×9</button>
      <button data-w="16" data-h="16" data-m="40">중급 16×16</button>
      <button data-w="24" data-h="16" data-m="70">고급 24×16</button>
    </div>
    <div class="msbar">
      <span>남은 지뢰: <b id="mines">0</b></span>
      <span>시간: <b id="time">0</b>초</span>
      <span>상태: <b id="state">진행 중</b></span>
      <button class="btn sec" id="restart" style="width:auto;margin:0;padding:6px 12px">새 게임</button>
    </div>
    <div class="msscroll"><table class="ms" id="board"></table></div>
  </div>
  <div class="copy">
    <h2>규칙</h2>
    <p>칸을 열어 지뢰를 피하세요. 열린 칸의 숫자는 주변 8칸에 있는 지뢰 개수예요. 숫자를 보고 지뢰 위치를 추리해 깃발을 꽂고, 지뢰 아닌 칸을 모두 열면 성공! 첫 클릭은 절대 지뢰가 아니에요.</p>
    <details><summary>깃발은 어떻게 꽂나요?</summary><p>PC는 우클릭, 모바일은 칸을 길게 누르면 깃발(!)이 꽂혀요. 한 번 더 하면 해제.</p></details>
  </div>
  <div id="lounge-skip"></div>
  <div id="site-footer"></div>
</div>
<script>window.SITE_ROOT="../";</script>
<script src="../common.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var W,H,M,bd,started,over,flags,revCount,secs,timer;
  function letter(i){var s="";i++;while(i>0){var r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s}
  function init(w,h,m){W=w;H=h;M=m;bd=[];for(var r=0;r<H;r++){bd[r]=[];for(var c=0;c<W;c++)bd[r][c]={mine:false,rev:false,flag:false,adj:0}}
    started=false;over=false;flags=0;revCount=0;secs=0;clearInterval(timer);$("#time").textContent=0;$("#state").textContent="진행 중";$("#mines").textContent=M;render()}
  function place(sr,sc){var spots=[];for(var r=0;r<H;r++)for(var c=0;c<W;c++){if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;spots.push([r,c])}
    for(var i=spots.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=spots[i];spots[i]=spots[j];spots[j]=t}
    for(var k=0;k<M&&k<spots.length;k++)bd[spots[k][0]][spots[k][1]].mine=true;
    for(var r=0;r<H;r++)for(var c=0;c<W;c++){var n=0;for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){var nr=r+dr,nc=c+dc;if(nr>=0&&nr<H&&nc>=0&&nc<W&&bd[nr][nc].mine)n++}bd[r][c].adj=n}}
  function startTimer(){timer=setInterval(function(){secs++;$("#time").textContent=secs},1000)}
  function reveal(r,c){if(over)return;var cell=bd[r][c];if(cell.rev||cell.flag)return;
    if(!started){started=true;place(r,c);startTimer()}
    if(cell.mine){over=true;cell.boom=true;clearInterval(timer);revealAllMines();$("#state").textContent="실패";render();return}
    var stack=[[r,c]];while(stack.length){var p=stack.pop(),cr=p[0],cc=p[1],cl=bd[cr][cc];if(cl.rev||cl.flag||cl.mine)continue;cl.rev=true;revCount++;
      if(cl.adj===0){for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){var nr=cr+dr,nc=cc+dc;if(nr>=0&&nr<H&&nc>=0&&nc<W&&!bd[nr][nc].rev)stack.push([nr,nc])}}}
    if(revCount===W*H-M){over=true;clearInterval(timer);$("#state").textContent="성공! 🎉".replace(" 🎉","");render();return}
    render()}
  function revealAllMines(){for(var r=0;r<H;r++)for(var c=0;c<W;c++)if(bd[r][c].mine)bd[r][c].rev=true}
  function toggleFlag(r,c){if(over)return;var cell=bd[r][c];if(cell.rev)return;cell.flag=!cell.flag;flags+=cell.flag?1:-1;$("#mines").textContent=M-flags;render()}
  function render(){
    var h="<tr><th></th>";for(var c=0;c<W;c++)h+="<th>"+letter(c)+"</th>";h+="</tr>";
    for(var r=0;r<H;r++){h+="<tr><th>"+(r+1)+"</th>";for(var c=0;c<W;c++){var cl=bd[r][c],cls="",txt="";
      if(cl.flag&&!cl.rev){cls="flag";txt="!"}
      else if(cl.rev){if(cl.mine){cls=cl.boom?"mine boom":"mine";txt="●"}else{cls="rev"+(cl.adj?" n"+cl.adj:"");txt=cl.adj?cl.adj:""}}
      h+="<td class='"+cls+"' data-r='"+r+"' data-c='"+c+"'>"+txt+"</td>"}h+="</tr>"}
    $("#board").innerHTML=h}
  // events
  var longTimer=null,longed=false;
  $("#board").addEventListener("click",function(e){var td=e.target.closest("td");if(!td||!td.dataset.r)return;if(longed){longed=false;return}reveal(+td.dataset.r,+td.dataset.c)});
  $("#board").addEventListener("contextmenu",function(e){var td=e.target.closest("td");if(td&&td.dataset.r){e.preventDefault();toggleFlag(+td.dataset.r,+td.dataset.c)}});
  $("#board").addEventListener("touchstart",function(e){var td=e.target.closest("td");if(!td||!td.dataset.r)return;longed=false;longTimer=setTimeout(function(){longed=true;toggleFlag(+td.dataset.r,+td.dataset.c)},420)},{passive:true});
  $("#board").addEventListener("touchend",function(){clearTimeout(longTimer)});
  $("#diff").addEventListener("click",function(e){var b=e.target;if(b.tagName!=="BUTTON")return;
    [].forEach.call(this.children,function(x){x.classList.remove("on")});b.classList.add("on");
    init(+b.dataset.w,+b.dataset.h,+b.dataset.m)});
  $("#restart").addEventListener("click",function(){init(W,H,M)});
  init(9,9,10);
})();
</script>
</body>
</html>
