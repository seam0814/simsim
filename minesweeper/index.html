<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 문서4 - Excel</title>
<meta name="description" content="스프레드시트형 지뢰찾기. 데이터 검증 영역 칸을 열어 지뢰를 피하세요. 왼쪽 클릭=열기, 우클릭(모바일 길게)=깃발. 무료.">
<link rel="canonical" href="https://seam0814.github.io/simsim/minesweeper/">
<link rel="stylesheet" href="../style.css">
<style>
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 8px;font-size:12px;color:#555}
  .toolbar b{color:#1b5e20}
  .toolbar .diff button{font:inherit;border:1px solid #d4d4d4;background:#f8f8f8;padding:4px 9px;border-radius:3px;cursor:pointer;margin-right:5px;color:#217346;font-size:12px}
  .toolbar .diff button.on{background:#217346;color:#fff;border-color:#217346}
  .toolbar .mini{border:1px solid #d4d4d4;background:#f8f8f8;padding:4px 9px;border-radius:3px;cursor:pointer;color:#555;font-size:12px}
  .msscroll{overflow:auto;border:1px solid #c6c6c6;background:#fff}
  table.sheet{border-collapse:collapse;table-layout:fixed}
  table.sheet th{background:#f3f3f3;color:#999;font-size:11px;border:1px solid #d4d4d4;height:22px;text-align:center;font-weight:600}
  table.sheet th.cn{width:60px;min-width:60px}
  table.sheet th.rn{width:30px;min-width:30px}
  table.sheet td{border:1px solid #dcdcdc;height:22px;width:60px;max-width:60px;padding:1px 6px;font-size:13px;background:#fff;overflow:hidden;white-space:nowrap;text-overflow:clip}
  td.f-title{font-weight:700;color:#1b5e20;background:#eef6ef;text-align:left;overflow:visible}
  td.f-hd{background:#f7f7f7;color:#555;font-weight:600;text-align:center}
  td.f-lbl{color:#333;text-align:left}
  td.f-num{text-align:right;color:#333}
  td.g{cursor:pointer;text-align:center;font-weight:700;background:#e7e7e7;user-select:none}
  td.g:hover{background:#dceedd}
  td.grev{background:#fff;text-align:center;font-weight:700;cursor:default}
  td.gflag{background:#ffe0e0;color:#c62828;text-align:center;cursor:pointer;font-weight:700}
  td.gmine{background:#333;color:#fff;text-align:center}
  td.gboom{background:#c62828;color:#fff;text-align:center}
  .n1{color:#1565c0}.n2{color:#2e7d32}.n3{color:#c62828}.n4{color:#6a1b9a}.n5{color:#8d6e63}.n6{color:#00838f}.n7{color:#333}.n8{color:#777}
</style>
</head>
<body>
<div class="wrap">
  <div id="site-header"></div>
  <div class="toolbar">
    <span class="diff" id="diff"><button data-w="9" data-h="9" data-m="10" class="on">초급</button><button data-w="16" data-h="16" data-m="40">중급</button><button data-w="20" data-h="14" data-m="55">고급</button></span>
    <span>남은: <b id="mines">0</b></span><span>시간: <b id="time">0</b></span><span>상태: <b id="state">진행 중</b></span>
    <button class="mini" id="restart">새로고침</button>
  </div>
  <div class="msscroll"><table class="sheet" id="board"></table></div>
  <div class="copy">
    <h2>안내</h2>
    <p>위쪽은 요약 데이터, 아래 "검증 영역"이 지뢰찾기 판이에요. 칸을 열어 지뢰를 피하고(열린 칸 숫자 = 주변 8칸 지뢰 수), 지뢰 아닌 칸을 모두 열면 성공. 첫 클릭은 안전해요. <b>왼쪽 클릭=열기, 우클릭(모바일은 길게 누르기)=깃발, Esc=요약만 보기.</b></p>
  </div>
  <div id="site-footer"></div>
</div>
<script>window.SITE_ROOT="../";</script>
<script src="../common.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var W,H,M,bd,started,over,flags,revCount,secs,timer;
  var GC0=1,GR0=9,SC,SR,FAKE;
  function letter(i){var s="";i++;while(i>0){var r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s}
  function layout(){
    SC=Math.max(W+GC0+2,8);SR=GR0+H+2;FAKE={};
    function F(r,c,t,cls,span){FAKE[r+","+c]={t:t,cls:cls||"f-lbl",span:span||1}}
    F(0,0,"2026년 3분기 영업 실적 현황 (단위: 백만원)","f-title",Math.min(SC,7));
    F(2,0,"품목","f-hd");F(2,1,"1월","f-hd");F(2,2,"2월","f-hd");F(2,3,"3월","f-hd");F(2,4,"합계","f-hd");
    F(3,0,"모듈A","f-lbl");F(3,1,"1,240","f-num");F(3,2,"1,310","f-num");F(3,3,"1,455","f-num");F(3,4,"4,005","f-num");
    F(4,0,"모듈B","f-lbl");F(4,1,"980","f-num");F(4,2,"1,020","f-num");F(4,3,"1,105","f-num");F(4,4,"3,105","f-num");
    F(5,0,"부자재","f-lbl");F(5,1,"430","f-num");F(5,2,"455","f-num");F(5,3,"470","f-num");F(5,4,"1,355","f-num");
    F(6,0,"합계","f-lbl");F(6,1,"2,650","f-num");F(6,2,"2,785","f-num");F(6,3,"3,030","f-num");F(6,4,"8,465","f-num");
    F(8,0,"데이터 검증 영역 (하단 셀 확인)","f-title",Math.min(SC,6));
  }
  function init(w,h,m){W=w;H=h;M=m;layout();bd=[];for(var r=0;r<H;r++){bd[r]=[];for(var c=0;c<W;c++)bd[r][c]={mine:false,rev:false,flag:false,adj:0,boom:false}}
    started=false;over=false;flags=0;revCount=0;secs=0;clearInterval(timer);$("#time").textContent=0;$("#state").textContent="진행 중";$("#mines").textContent=M;render()}
  function place(sr,sc){var sp=[];for(var r=0;r<H;r++)for(var c=0;c<W;c++){if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;sp.push([r,c])}
    for(var i=sp.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=sp[i];sp[i]=sp[j];sp[j]=t}
    for(var k=0;k<M&&k<sp.length;k++)bd[sp[k][0]][sp[k][1]].mine=true;
    for(var r=0;r<H;r++)for(var c=0;c<W;c++){var n=0;for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){var nr=r+dr,nc=c+dc;if(nr>=0&&nr<H&&nc>=0&&nc<W&&bd[nr][nc].mine)n++}bd[r][c].adj=n}}
  function reveal(gr,gc){if(over)return;var cell=bd[gr][gc];if(cell.rev||cell.flag)return;
    if(!started){started=true;place(gr,gc);timer=setInterval(function(){secs++;$("#time").textContent=secs},1000)}
    if(cell.mine){over=true;cell.boom=true;clearInterval(timer);for(var r=0;r<H;r++)for(var c=0;c<W;c++)if(bd[r][c].mine)bd[r][c].rev=true;$("#state").textContent="실패";render();return}
    var st=[[gr,gc]];while(st.length){var p=st.pop(),cr=p[0],cc=p[1],cl=bd[cr][cc];if(cl.rev||cl.flag||cl.mine)continue;cl.rev=true;revCount++;
      if(cl.adj===0)for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){var nr=cr+dr,nc=cc+dc;if(nr>=0&&nr<H&&nc>=0&&nc<W&&!bd[nr][nc].rev)st.push([nr,nc])}}
    if(revCount===W*H-M){over=true;clearInterval(timer);$("#state").textContent="성공";}
    render()}
  function toggleFlag(gr,gc){if(over)return;var cell=bd[gr][gc];if(cell.rev)return;cell.flag=!cell.flag;flags+=cell.flag?1:-1;$("#mines").textContent=M-flags;render()}
  function render(){
    var h="<tr><th class='rn'></th>";for(var c=0;c<SC;c++)h+="<th class='cn'>"+letter(c)+"</th>";h+="</tr>";
    for(var r=0;r<SR;r++){h+="<tr><th class='rn'>"+(r+1)+"</th>";var skip=0;
      for(var c=0;c<SC;c++){if(skip>0){skip--;continue;}
        if(r>=GR0&&r<GR0+H&&c>=GC0&&c<GC0+W){var gr=r-GR0,gc=c-GC0,cl=bd[gr][gc],cls="g",txt="";
          if(cl.flag&&!cl.rev){cls="gflag";txt="!";}
          else if(cl.rev){if(cl.mine){cls=cl.boom?"gboom":"gmine";txt="●";}else{cls="grev"+(cl.adj?" n"+cl.adj:"");txt=cl.adj||"";}}
          h+="<td class='"+cls+"' data-gr='"+gr+"' data-gc='"+gc+"'>"+txt+"</td>";
        } else {var f=FAKE[r+","+c];
          if(f){var sp=f.span||1;skip=sp-1;h+="<td class='"+f.cls+"'"+(sp>1?" colspan='"+sp+"'":"")+">"+f.t+"</td>";}
          else h+="<td></td>";
        }
      }h+="</tr>";
    }$("#board").innerHTML=h}
  var lt=null,longed=false;
  $("#board").addEventListener("click",function(e){var td=e.target.closest("td");if(!td||td.dataset.gr===undefined)return;if(longed){longed=false;return}reveal(+td.dataset.gr,+td.dataset.gc)});
  $("#board").addEventListener("contextmenu",function(e){var td=e.target.closest("td");if(td&&td.dataset.gr!==undefined){e.preventDefault();toggleFlag(+td.dataset.gr,+td.dataset.gc)}});
  $("#board").addEventListener("touchstart",function(e){var td=e.target.closest("td");if(!td||td.dataset.gr===undefined)return;longed=false;lt=setTimeout(function(){longed=true;toggleFlag(+td.dataset.gr,+td.dataset.gc)},420)},{passive:true});
  $("#board").addEventListener("touchend",function(){clearTimeout(lt)});
  $("#diff").addEventListener("click",function(e){var b=e.target;if(b.tagName!=="BUTTON")return;[].forEach.call(this.children,function(x){x.classList.remove("on")});b.classList.add("on");init(+b.dataset.w,+b.dataset.h,+b.dataset.m)});
  $("#restart").addEventListener("click",function(){init(W,H,M)});
  init(9,9,10);
})();
</script>
</body>
</html>
