<h2>1. 처리 방식</h2><p>모든 게임·테스트는 브라우저에서 실행되며, 입력·결과는 서버로 전송·저장되지 않습니다. 일부 기록(최고점수 등)은 이용자 기기에만 저장될 수 있습니다.</p>
<h2>2. 광고·분석</h2><p>사이트 운영을 위해 제3자(예: Google Analytics, Google AdSense)가 쿠키를 사용할 수 있습니다. <a href="https://www.google.com/settings/ads" target="_blank" rel="noopener">Google 광고 설정</a>에서 해제 가능합니다.</p>
<h2>3. 외부 링크</h2><p>일부 놀거리는 외부 사이트로 연결됩니다(새 탭).</p>
<h2>4. 콘텐츠 성격</h2><p>모든 콘텐츠는 오락 목적입니다.</p>
