<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통합 문서 - Excel</title>
<meta name="description" content="한 화면에서 실시간 뉴스·미니게임·익명 채팅. 맞춤 뉴스·좋아요·댓글까지. Esc·Alt+숫자로 업무화면 위장.">
<link rel="canonical" href="https://seam0814.github.io/simsim/">
<link rel="stylesheet" href="./style.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font)}
  .sheet{height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
  .colhdr{display:flex;flex:0 0 22px;background:var(--head);border-bottom:1px solid var(--line);overflow:hidden}
  .colhdr .corner{flex:0 0 34px;border-right:1px solid var(--line)}
  .colhdr .c{flex:0 0 64px;text-align:center;line-height:22px;font-size:11px;color:#8a8a8a;border-right:1px solid var(--line)}
  .srow{flex:1;display:flex;min-height:0;overflow:hidden}
  .rowhdr{flex:0 0 34px;background:var(--head);border-right:1px solid var(--line);overflow:hidden}
  .rowhdr .r{height:22px;line-height:22px;text-align:center;font-size:11px;color:#8a8a8a;border-bottom:1px solid var(--line)}
  .content{flex:1;min-height:0;position:relative;background:#fff;overflow:hidden}
  .gridbg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background-image:linear-gradient(#ededed 1px,transparent 1px),linear-gradient(90deg,#ededed 1px,transparent 1px);background-size:64px 22px}
  .gridbg span{position:absolute;height:22px;line-height:22px;padding:0 4px;font-size:10px;color:#d6d6d6;overflow:hidden;white-space:nowrap}
  .view{display:none;position:absolute;inset:4px;z-index:1}
  .view.on{display:flex}
  .v-dash{gap:4px}
  .v-sales.on,.v-q.on,.v-s3.on{display:block;overflow:auto;background:#fff;border:1px solid #b7b7b7}
  /* 컬럼 + 리사이즈 핸들 */
  .col{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
  .col.left{flex:0 0 300px}.col.center{flex:1 1 auto}.col.right{flex:0 0 322px}
  .col>.panel{flex:1 1 auto;min-height:80px}
  .colfill{flex:0 0 0;min-height:0;pointer-events:none}
  .wrez{position:absolute;top:0;bottom:0;width:9px;z-index:6;cursor:col-resize;background:#e4e8ea}
  .col.left .wrez{right:-5px}.col.right .wrez{left:-5px}
  .hrez{flex:0 0 7px;cursor:row-resize;z-index:6;background:transparent}
  .wrez:hover,.hrez:hover{background:rgba(33,115,70,.3)}
  .panel{background:#fff;border:1px solid #b7b7b7;display:flex;flex-direction:column;min-height:0;position:relative;box-shadow:1px 1px 0 rgba(0,0,0,.04)}
  .ph{background:var(--head);color:#1b5e20;border-bottom:1px solid var(--line);font-weight:700;font-size:12px;padding:5px 9px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex:0 0 auto}
  .ph .ctl{font-weight:400;display:flex;gap:6px;align-items:center}
  .ph label{font-size:11px;color:#555;display:flex;align-items:center;gap:3px;cursor:pointer}
  .pb{flex:1;min-height:0;overflow:auto;background:#fff;background-image:linear-gradient(#f4f4f4 1px,transparent 1px);background-size:100% 26px}
  .center .pb{overflow:hidden;display:flex;flex-direction:column;background:#fff}
  .center iframe{flex:1;width:100%;border:0;background:#fff}
  #gsel{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:#1b5e20;border-radius:0;padding:1px 4px;max-width:150px}
  #nref,#toGame,#homeBtn{cursor:pointer;background:#fff;border:1px solid var(--line);color:#1b5e20;font-size:11px;padding:1px 7px;border-radius:0}
  .sokbar{background:#fff8e6;border-bottom:1px solid #ecd9a0;padding:6px 9px;font-size:12px;color:#8a6d00;line-height:1.4;flex:0 0 auto}
  .sokbar b{color:#c0504d}
  .nitem{display:flex;text-decoration:none;color:#1c2b1c;font-size:13px;line-height:1.4;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
  .nitem .ni{flex:0 0 26px;background:var(--head);color:#9a9a9a;border-right:1px solid var(--line);text-align:center;font-size:10px;padding-top:7px}
  .nitem .nt{padding:7px 9px;min-width:0}
  .nitem:hover .nt{background:#eafaf0}
  .nitem .nm{font-size:11px;color:#8a8f98;margin-top:2px}
  .nloading{padding:14px 10px;color:#aaa;font-size:12px}
  /* 가운데 뉴스 리더 */
  .creader{flex:1;overflow:auto;padding:16px 20px;background:#fff;display:none}
  .creader.on{display:block}
  .creader .rtitle{font-size:18px;font-weight:700;line-height:1.45;color:#1c2b1c}
  .creader .rmeta{font-size:12px;color:#8a8f98;margin:7px 0 14px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .creader .ract{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .creader .rorig{display:inline-block;background:var(--sel);color:#fff;text-decoration:none;padding:8px 16px;font-size:13px;font-weight:700}
  .creader .likebtn{cursor:pointer;border:1px solid var(--line);background:#fff;color:#c0392b;font-size:13px;padding:7px 14px;font-weight:700}
  .creader .likebtn.done{background:#fdeeee}
  .rrel-h{font-size:12px;font-weight:700;color:#1b5e20;border-left:3px solid var(--sel);padding-left:7px;margin:18px 0 6px}
  .rrel a{display:block;font-size:12.5px;color:#245;text-decoration:none;padding:5px 0;border-bottom:1px solid #f0f0f0;line-height:1.4}
  .rrel a:hover{color:#217346}
  .cmtbox{margin-top:8px}
  .cmt{padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
  .cmt b{color:var(--sel);margin-right:6px;font-size:12px}
  .cmtform{display:flex;gap:6px;margin-top:8px}
  .cmtform input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);font:inherit}
  .cmtform input.nk{flex:0 0 80px}
  .cmtform button{border:none;background:var(--sel);color:#fff;padding:8px 14px;cursor:pointer;font-weight:700}
  .rnote{font-size:11px;color:#aaa;margin-top:12px}
  /* 채팅 엑셀 배경 */
  .right .pb{background-image:linear-gradient(#eef2ee 1px,transparent 1px),linear-gradient(90deg,#eef2ee 1px,transparent 1px);background-size:64px 22px}
  .right #lounge{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 9px 9px}
  .right #lounge .cat{margin:9px 0 6px;border-left:3px solid var(--sel)}
  .right #lounge .chatbox{max-height:none;flex:1;min-height:0;border-radius:0;background-color:rgba(255,255,255,.78);background-image:linear-gradient(#e8efe8 1px,transparent 1px),linear-gradient(90deg,#e8efe8 1px,transparent 1px);background-size:110px 24px}
  .right #lounge .chatform input,.right #lounge .chatform .btn{border-radius:0}
  .right .pb{padding:0}
  /* 데이터 시트 */
  .dsheet{padding:2px 0 24px}
  .dsheet h2{font-size:13px;color:#1b5e20;margin:12px 12px 8px;font-weight:700}
  .xtable{border-collapse:collapse;font-size:12px;margin:0 12px 22px}
  .xtable th,.xtable td{border:1px solid var(--line);padding:3px 8px;white-space:nowrap;height:22px}
  .xtable th{background:var(--head);color:#555;font-weight:600;position:sticky;top:0;z-index:2}
  .xtable td.lbl{background:#fafafa;font-weight:600;color:#333;text-align:left;position:sticky;left:0}
  .xtable td.num{text-align:right;font-variant-numeric:tabular-nums}
  .xtable tr.total td{font-weight:700;border-top:2px solid #999;background:#f0f6f0}
  .tabs{flex:0 0 26px;display:flex;align-items:stretch;background:var(--head);border-top:1px solid var(--line);font-size:12px;overflow:hidden}
  .tabs .nav{color:#999;padding:0 8px;display:flex;align-items:center;border-right:1px solid var(--line)}
  .tabs .t{padding:0 14px;display:flex;align-items:center;border-right:1px solid var(--line);color:#555;cursor:pointer}
  .tabs .t:hover{background:#eee}
  .tabs .t.on{background:#fff;color:#1b5e20;font-weight:700;border-top:2px solid var(--sel);margin-top:-1px}
  .tabs .plus{padding:0 10px;display:flex;align-items:center;color:#999}
  .tabs .status{margin-left:auto;padding:0 12px;display:flex;align-items:center;color:#999;font-size:11px}
  @media(max-width:860px){
    .sheet{height:auto}.srow{flex-direction:column}.rowhdr{display:none}
    .content{overflow:visible}.view{position:static;inset:auto}
    .v-dash.on{flex-direction:column}.col{flex:none!important;width:auto!important}
    .col.center{height:470px}.col.left{height:340px}.col.right{min-height:360px}
    .wrez,.hrez{display:none}.colfill{display:none}
    .colhdr .c:nth-child(n+8){display:none}
  }
  .creader{background-image:linear-gradient(#eef2ee 1px,transparent 1px),linear-gradient(90deg,#eef2ee 1px,transparent 1px);background-size:64px 24px}
  .creader .rsum{font-size:14px;line-height:1.7;color:#333;background:rgba(255,255,255,.9);border-left:3px solid var(--sel);padding:10px 14px;margin-bottom:14px}
  .creader .rsum.muted{color:#aaa;border-color:#ccc}
  .cmt{position:relative}
  .cmt .clk{float:right;border:1px solid var(--line);background:#fff;color:#c0392b;font-size:11px;padding:1px 7px;cursor:pointer}
  .cmt.best{background:#fffaf0;border-left:3px solid #e0a800;padding-left:8px}
  .besttag{display:inline-block;background:#e0a800;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;margin-right:6px;vertical-align:middle}
  .wrez::after{content:"";position:absolute;top:50%;height:46px;width:3px;margin-top:-23px;background:#b7b7b7;border-radius:2px}
  .col.left .wrez::after{left:2px}.col.right .wrez::after{left:3px}
  .hrez{flex:0 0 12px;background:#e4e8ea}
  .hrez::after{content:"";display:block;width:46px;height:3px;margin:3px auto;background:#b7b7b7;border-radius:2px}
  .wrez:hover::after,.hrez:hover::after{background:#217346}
  .ph .ptog{cursor:pointer;background:transparent;border:0;color:#1b5e20;font-size:13px;line-height:1;padding:0 6px 0 0;font-weight:700}
  .ph .ptog:hover{color:#0a3}
  .panel.collapsed{flex:0 0 auto !important}
  .panel.collapsed>.pb,.panel.collapsed>.sokbar{display:none}
  .col.pcol .hrez,.col.pcol .wrez{display:none}
  .cwelcome{flex:1;overflow:auto;display:none;padding:20px;background:#fff;background-image:linear-gradient(#f4f4f4 1px,transparent 1px);background-size:100% 26px}
  .cwelcome.on{display:block}
  .cwelcome h2{font-size:1.1rem;color:#1b5e20;margin:0 0 8px}
  .cwelcome p{font-size:12.5px;color:#555;line-height:1.7;margin:0 0 16px}
  .gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
  .gcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:4px;padding:11px;cursor:pointer;font:inherit;display:block}
  .gcard:hover{background:#eafaf0;border-color:var(--sel)}
  .gcard b{display:block;color:#1b5e20;font-size:13px;margin-bottom:2px}
  .gcard small{color:#888;font-size:11px}
  .tabs .tbtn{padding:0 12px;display:flex;align-items:center;border-right:1px solid var(--line);color:#0f6cbd;cursor:pointer}
  .tabs .tbtn:hover{background:#eee}
  :root[data-skin="mail"]{--bar:#0f6cbd;--sel:#0f6cbd;--accent:#0f6cbd}
  [data-skin="mail"] .ph{color:#0a4a8c}
  [data-skin="mail"] .tabs .t.on{color:#0a4a8c;border-top-color:#0f6cbd}
  [data-skin="mail"] .cwelcome h2,[data-skin="mail"] .gcard b,[data-skin="mail"] .rrel-h,[data-skin="mail"] .rtitle{color:#0a4a8c}
  [data-skin="mail"] .sokbar{background:#eef4fb;border-color:#cfe0f3;color:#0a4a8c}
  [data-skin="mail"] .sokbar b{color:#0f6cbd}
  .mailv{display:flex;height:calc(100vh - 96px);background:#fff}
  [data-skin="excel"] #mailView{display:none}
  [data-skin="mail"] #excelView{display:none}
  .mside{flex:0 0 190px;background:#faf9f8;border-right:1px solid #e1dfdd;display:flex;flex-direction:column;padding:6px 0;font-size:13px;position:relative}
  .msideHd{padding:6px 14px;color:#999;font-size:11px}
  .mfold{padding:8px 14px;color:#333;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .mfold:hover{background:#f0f0f0}
  .mfold.on{background:#eaf2fb;color:#0f6cbd;font-weight:700;border-left:3px solid #0f6cbd;padding-left:11px}
  .mfold .cnt{background:#0f6cbd;color:#fff;border-radius:9px;font-size:10px;padding:0 6px;font-weight:700}
  .mpres{margin-top:auto;padding:8px 14px;color:#888;font-size:11px}
  .mskin{padding:9px 14px;color:#0f6cbd;cursor:pointer;font-size:12px;border-top:1px solid #e1dfdd}
  .mskin:hover{background:#eaf2fb}
  .mlist{flex:0 0 360px;border-right:1px solid #e1dfdd;overflow:auto;background:#fff;position:relative}
  .mitem{padding:9px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer}
  .mitem:hover{background:#f5faff}.mitem.on{background:#eaf2fb}
  .mitem .mfrom{font-size:12px;color:#222;font-weight:700;display:flex;justify-content:space-between;gap:6px}
  .mitem .mfrom .md{color:#999;font-weight:400;font-size:11px;white-space:nowrap}
  .mitem .msub{font-size:13px;color:#222;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
  .mitem.unread .msub{font-weight:700;color:#000}
  .mitem .mprev{font-size:11px;color:#999;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mread{flex:1;overflow:auto;padding:18px 22px;background:#fff;min-width:0}
  .mread .remail-h{font-size:17px;font-weight:700;color:#1c2b1c;margin-bottom:4px}
  .mread .remail-m{font-size:12px;color:#8a8f98;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:14px}
  .mread .remail-b{font-size:14px;line-height:1.85;color:#333;white-space:pre-wrap}
  .mread iframe{width:100%;height:100%;min-height:470px;border:0;display:block}
  .mread #lounge{display:flex;flex-direction:column;height:100%}
  .mread #lounge .chatbox{max-height:none;flex:1;min-height:320px}
  @media(max-width:860px){.mailv{flex-direction:column;height:auto}.mside{flex:none;flex-direction:row;flex-wrap:wrap;padding:4px}.msideHd,.mpres{display:none}.mskin{border:0}.mlist{flex:none;max-height:260px}.mread{min-height:420px}}
  .mlist{display:flex;flex-direction:column}
  .mbar{flex:0 0 auto;display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid #e1dfdd;background:#faf9f8}
  .msearch{flex:1;min-width:0;border:1px solid #d4d4d4;border-radius:14px;padding:5px 12px;font:inherit;font-size:12px}
  .mcmd{font-size:12px;color:#0f6cbd;cursor:pointer;padding:5px 6px;white-space:nowrap}
  .mcmd:hover{text-decoration:underline}
  .mitems{flex:1;overflow:auto}
  .mitem{display:flex;gap:10px;align-items:flex-start}
  .mav{flex:0 0 32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:1px}
  .mbody{flex:1;min-width:0}
  .mempty{color:#999;font-size:13px;padding-top:36px;text-align:center}
  .rebar{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
  .rebar button{font:inherit;font-size:12px;border:1px solid #d4d4d4;background:#fff;color:#0f6cbd;padding:5px 12px;border-radius:4px;cursor:pointer}
  .rebar button:hover{background:#eaf2fb}
  .rehead{display:flex;gap:10px;align-items:center;margin:4px 0 16px}
  .refrom{font-size:13px;font-weight:700;color:#222}
  .reem{color:#888;font-weight:400;font-size:12px}
  .reto{font-size:12px;color:#8a8f98;margin-top:2px}
  .resig{margin-top:22px;padding-top:12px;border-top:1px solid #eee;color:#999;font-size:12px;white-space:pre-wrap}
  .msubs{display:none}
  .msubs.on{display:block}
  .msub{padding:6px 14px 6px 28px;color:#555;cursor:pointer;font-size:12px}
  .msub:hover{background:#f0f0f0}
  .msub.on{color:#0f6cbd;font-weight:700;background:#eef4fb}
  .mrez{position:absolute;top:0;bottom:0;right:-3px;width:8px;cursor:col-resize;z-index:8}
  .mrez:hover{background:rgba(15,108,189,.3)}
  @media(max-width:860px){.mrez{display:none}}
  .nsort{position:sticky;top:0;background:#faf9f8;border-bottom:1px solid #e1dfdd;padding:6px 12px;font-size:12px;display:flex;gap:12px;z-index:2}
  .ns{cursor:pointer;color:#888}
  .ns.on{color:#0f6cbd;font-weight:700}
  .roomhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px;color:#1c2b1c}
  .roomnick{font-size:12px;color:#888}
  .roomnick a,.mread .rnote a{color:#0f6cbd;cursor:pointer;text-decoration:underline}
  .mread #rbox{max-height:none;height:54vh;min-height:300px}
  .nsort .ns#newRoom,.nsort .ns#newRoom.on{color:#0f6cbd;font-weight:700}
</style>
</head>
<body>
<div class="sheet" id="excelView">
  <div class="colhdr" id="colh"><div class="corner"></div></div>
  <div class="srow">
    <div class="rowhdr" id="rowh"></div>
    <div class="content">
      <div class="gridbg" id="gridbg"></div>
      <div class="view v-dash on">
        <div class="col left" id="colL"><div class="colfill" data-f="top"></div><div class="hrez" data-h="top"></div>
          <div class="panel">
            <div class="ph"><span>A : 실시간 뉴스</span><span class="ctl"><label><input type="checkbox" id="pers"> 맞춤</label><button id="nref">↻</button></span></div>
            <div class="sokbar" id="sok">속보 불러오는 중…</div>
            <div class="pb" id="news"><div class="nloading">불러오는 중…</div></div>
          </div>
          <div class="hrez" data-h="bot"></div><div class="colfill" data-f="bot"></div><div class="wrez"></div>
        </div>
        <div class="col center">
          <div class="panel">
            <div class="ph"><span id="cph">작업 영역</span><span class="ctl"><button id="homeBtn">홈</button><select id="gsel"></select><button id="toGame" hidden>게임으로</button></span></div>
            <div class="pb"><iframe id="gframe" title="game" referrerpolicy="no-referrer"></iframe><div class="creader" id="creader"></div><div class="cwelcome" id="cwelcome"><h2>사무실 대시보드</h2><p>왼쪽은 <b>실시간 뉴스</b>, 오른쪽은 <b>익명 채팅</b>, 가운데에서 <b>게임</b>을 즐겨요. 위 드롭다운이나 아래 카드로 고르세요.<br><b>Esc</b>=업무화면(보스키) · <b>Alt+1~4</b>=시트 전환 · 각 창 <b>▾</b> 접기 · 가장자리 드래그로 크기 조절.</p><div class="gcards" id="gcards"></div></div></div>
          </div>
        </div>
        <div class="col right" id="colR"><div class="colfill" data-f="top"></div><div class="hrez" data-h="top"></div>
          <div class="wrez"></div>
          <div class="panel">
            <div class="ph"><span>검토 : 메모</span><span class="ctl" style="color:#888;font-size:11px">접속 <b class="presN" style="color:#1b5e20">·</b> · 익명</span></div>
            <div class="pb"><div id="lounge"></div></div>
          </div>
          <div class="hrez" data-h="bot"></div><div class="colfill" data-f="bot"></div>
        </div>
      </div>
      <div class="view v-sales" id="vSales"></div>
      <div class="view v-q" id="vQ"></div>
      <div class="view v-s3" id="vS3"></div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <span class="nav">◀ ▶</span>
    <span class="t on" data-v="dash">대시보드</span><span class="t" data-v="sales">매출실적</span>
    <span class="t" data-v="q">분기요약</span><span class="t" data-v="s3">Sheet3</span>
    <span class="plus">＋</span><span class="tbtn" id="skinBtn">메일 보기</span><span class="status" id="status">준비</span>
  </div>
</div>
<div class="mailv" id="mailView">
  <div class="mside">
    <div class="msideHd">폴더</div>
    <div class="mfold on" data-f="inbox">받은 편지함 <span class="cnt">12</span></div>

        +'<form class="chatform" id="rform"><input id="rmsg" maxlength="200" placeholder="메시지 입력 (Enter 전송)"><button class="btn" type="submit">전송</button></form>'
        +'<div class="rnote" style="font-size:11px;margin-top:6px">특정인·회사 비방, 개인정보 공유 금지 · <a id="rReport">신고</a></div>';
      document.getElementById("setNick").onclick=claimNick;
      document.getElementById("rReport").onclick=function(){if(DB)DB.collection("stats").add({k:"report",room:rid,ts:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});alert("신고가 접수되었어요.");};
      document.getElementById("rform").onsubmit=function(e){e.preventDefault();var t=(document.getElementById("rmsg").value||"").trim();if(!t)return;if(!DB){alert("채팅 연결 준비 중…");return;}
        DB.collection("lounge").add({room:rid,name:nickGet().slice(0,12),text:t.slice(0,200),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});document.getElementById("rmsg").value="";try{track("room_msg")}catch(ee){}};
      if(roomUnsub){roomUnsub();roomUnsub=null;}
      if(DB){roomUnsub=DB.collection("lounge").where("room","==",rid).onSnapshot(function(q){var arr=[];q.forEach(function(dc){arr.push(dc.data())});arr.sort(function(a,b){return (a.createdAt&&b.createdAt)?(a.createdAt.seconds-b.createdAt.seconds):0});arr=arr.slice(-60);
        var box=document.getElementById("rbox");if(!box)return;box.innerHTML=arr.length?arr.map(function(m){var tm="";try{if(m.createdAt&&m.createdAt.toDate){var dd=m.createdAt.toDate();tm=("0"+dd.getHours()).slice(-2)+":"+("0"+dd.getMinutes()).slice(-2)}}catch(e){}return '<div class="cmsg"><b>'+esc(m.name||"익명")+'</b> '+esc(m.text)+(tm?'<span class="ctime">'+tm+'</span>':"")+'</div>'}).join(""):'<div class="rnote">첫 메시지를 남겨보세요.</div>';box.scrollTop=box.scrollHeight;},function(){});}}
    function chat(){mread.innerHTML='<div class="mempty">왼쪽에서 방을 선택하세요.</div>';
      function render(extra){var rooms=PRESET.concat(extra||[]);
        mitems.innerHTML='<div class="nsort"><span class="ns on">방 목록</span><span class="ns" id="newRoom" style="margin-left:auto">+ 방 만들기</span></div>'
          +rooms.map(function(r){return '<div class="mitem" data-room="'+esc(r.id)+'" data-name="'+esc(r.name)+'"><div class="mav" style="background:'+avColor(r.name)+'">'+esc(r.name.charAt(0))+'</div><div class="mbody"><div class="mfrom">'+esc(r.name)+'</div><div class="msub">'+esc(r.desc||"")+'</div></div></div>'}).join("");
        mitems.querySelectorAll(".mitem").forEach(function(x){x.onclick=function(){enterRoom(x.getAttribute("data-room"),x.getAttribute("data-name"))}});
        var nr=document.getElementById("newRoom");if(nr)nr.onclick=function(e){e.stopPropagation();createRoom()};}
      render([]);
      if(DB){DB.collection("stats").where("k","==","room").get().then(function(q){var ex=[];q.forEach(function(dc){var m=dc.data();if(m.name)ex.push({id:m.rid||dc.id,name:m.name,desc:m.desc||""})});if(ex.length)render(ex)}).catch(function(){})}}
    function gameList(){mread.innerHTML='<div class="mempty">왼쪽에서 게임을 선택하세요.</div>';
      mitems.innerHTML=items.map(function(t){var href=t.ext?t.url:("./"+t.path);return row({top:t.title,topR:"게임",sub:t.desc,attr:'data-h="'+href+'"'})}).join("");
      clk(function(x){mread.innerHTML='<iframe referrerpolicy="no-referrer" src="'+x.getAttribute("data-h")+'"></iframe>'})}
    function setFold(f){folds.forEach(function(x){x.classList.toggle("on",x.getAttribute("data-f")===f)});showSubs(f==="news");
      if(f==="news"){markSub("all");newsList("all")}else if(f==="chat")chat();else if(f==="game")gameList();else inbox();
      var se=document.getElementById("msearch");if(se)se.value="";try{track("mail_fold",{f:f})}catch(e){}}
    folds.forEach(function(x){x.addEventListener("click",function(){setFold(x.getAttribute("data-f"))})});
    if(subs)subs.querySelectorAll(".msub").forEach(function(x){x.addEventListener("click",function(e){e.stopPropagation();folds.forEach(function(y){y.classList.toggle("on",y.getAttribute("data-f")==="news")});showSubs(true);markSub(x.getAttribute("data-cat"));newsList(x.getAttribute("data-cat"))})});
    var sb2=document.getElementById("skinBtn2");if(sb2)sb2.onclick=function(){store.set("skin","excel");location.reload()};
    var se=document.getElementById("msearch");if(se)se.addEventListener("input",function(){var q=this.value.trim().toLowerCase();mitems.querySelectorAll(".mitem").forEach(function(el){el.style.display=(!q||el.textContent.toLowerCase().indexOf(q)>=0)?"":"none"})});
    var mr=document.getElementById("mrefresh");if(mr)mr.onclick=function(){var on=document.querySelector("#mailView .mfold.on");setFold(on?on.getAttribute("data-f"):"inbox")};
    function mdrag(col,key,mn,mx){var h=col.querySelector(".mrez");if(!h)return;
      var sw=parseInt(store.get(key,""),10);if(sw>=mn&&sw<=mx)col.style.flexBasis=sw+"px";
      var drag=false,raf=0,pend=0;
      function ifr(v){document.querySelectorAll("#mread iframe").forEach(function(f){f.style.pointerEvents=v?"":"none"})}
      function dn(e){drag=true;e.preventDefault();document.body.style.userSelect="none";ifr(false)}
      function ap(){raf=0;col.style.flexBasis=pend+"px"}
      function mv(e){if(!drag)return;var x=e.touches?e.touches[0].clientX:e.clientX,r=col.getBoundingClientRect();pend=Math.max(mn,Math.min(mx,x-r.left));if(!raf)raf=requestAnimationFrame(ap)}
      function up(){if(!drag)return;drag=false;document.body.style.userSelect="";ifr(true);store.set(key,parseInt(col.style.flexBasis,10)||mn)}
      h.addEventListener("mousedown",dn);h.addEventListener("touchstart",dn,{passive:false});
      window.addEventListener("mousemove",mv);window.addEventListener("touchmove",mv,{passive:false});window.addEventListener("mouseup",up);window.addEventListener("touchend",up);}
    var msideEl=document.querySelector("#mailView .mside"),mlistEl=document.querySelector("#mailView .mlist");
    if(msideEl)mdrag(msideEl,"mside_w",140,320);
    if(mlistEl)mdrag(mlistEl,"mlist_w",260,620);
    var wp=document.getElementById("wipe");if(wp)wp.onclick=function(){if(confirm("이 기기에 저장된 닉네임·설정·좋아요/추천 기록을 모두 삭제할까요?")){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("ss_")===0)localStorage.removeItem(k)})}catch(e){}location.reload()}};
    setFold("inbox");
  })();

})();
</script>
</body>
</html>
